<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #00fff9; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

  #hud-loc { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px; font-size: clamp(1.05rem, 4.6vw, 1.5rem); letter-spacing: 1px; color: #fff; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.55); pointer-events: none; }
  #hud-obj { position: fixed; top: calc(40px + env(safe-area-inset-top)); left: 16px; font-size: 1.2rem; color: #ffe08a; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.55); pointer-events: none; }
  #hud-loot { position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 16px; font-size: 1.15rem; color: #fff; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.55); pointer-events: none; }
  #hud-status { position: fixed; top: calc(86px + env(safe-area-inset-top)); left: 16px; font-size: 1.05rem; color: #ffb347; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #toast { position: fixed; left: 0; right: 0; top: 24%; text-align: center; font-size: clamp(1.6rem, 7vw, 2.4rem); color: #ffe08a; text-shadow: 0 2px 4px #000, 0 0 14px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .25s; }
  #hud-debug { position: fixed; bottom: 6px; left: 8px; font-size: .9rem; color: #a0aec0; pointer-events: none; white-space: pre; display: none; }
  .btn { background: rgba(5,5,5,.6); border: 1px solid #00fff9; color: #00fff9; padding: 8px 16px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 10px rgba(0,255,249,.2); text-decoration: none; display: inline-block; }
  .btn.pink { border-color: #ff6ec7; color: #ff6ec7; background: rgba(5,5,5,.6); box-shadow: 0 0 14px rgba(255,110,199,.35); }
  #mute { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; padding: 4px 10px; }
  #back { position: fixed; top: calc(52px + env(safe-area-inset-top)); right: 14px; padding: 4px 10px; font-size: .85rem; }
  #enter-btn { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; font-size: 1.3rem; padding: 12px 26px; z-index: 5; }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(0,255,249,.45); border-radius: 50%; display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(0,255,249,.35); box-shadow: 0 0 12px rgba(0,255,249,.6); }
  #hint { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 1.15rem; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; transition: opacity .6s; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(5,5,5,.78); z-index: 10; }
  #fail { display: none; background: #050505; z-index: 20; }
  .title { font-size: clamp(2rem, 9vw, 3.4rem); color: #fff; letter-spacing: .12em; text-shadow: 0 0 14px #00fff9; line-height: 1; }
  .sub { font-size: 1.3rem; color: #ff6ec7; margin: 6px 0 18px; text-shadow: 0 0 8px rgba(255,110,199,.7); }
  .small { font-size: 1rem; color: rgba(255,255,255,.55); margin-top: 14px; max-width: 320px; }
</style>

<body>

  <button id="start-btn" class="btn pink vt" type="button" style="font-size:1.4rem;padding:12px 30px;">TAP TO START</button>
  <div class="small vt">WASD / ARROWS + DRAG TO LOOK<br>or use the on-screen thumb controls</div>

</div>

  <div id="fail-msg" class="small vt" style="margin:10px 0 18px;"></div>
  <a class="btn pink" href="../">Play the 2D game</a>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
function fail(msg) { $('fail-msg').textContent = msg; $('fail').style.display = 'flex'; }

// ---- load Three.js (break-proof: any failure shows a fallback to the 2D game) ----
let THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
try {
  THREE = await import('three');
  const [m1, m2, m3, m4] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
  ]);
  EffectComposer = m1.EffectComposer; RenderPass = m2.RenderPass; UnrealBloomPass = m3.UnrealBloomPass; OutputPass = m4.OutputPass;
} catch (e) {
  fail('Your browser could not load the 3D engine. The 2D game works everywhere.');
  throw e;
}

// ---- renderer + quality tiers ----
const params = new URLSearchParams(location.search);
const ua = navigator.userAgent;
const isMobile = /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
let tier = isMobile ? (lowEnd ? 0 : 1) : 2; // 0 = no bloom, 1 = half-res bloom, 2 = full bloom
if (params.has('tier')) tier = Math.max(0, Math.min(2, +params.get('tier') || 0));
const DPR_CAP = [1, 1.25, 2];

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  fail('This device or in-app browser blocked 3D graphics. Open the link in Safari or Chrome, or play the 2D game.');
  throw e;
}
renderer.toneMapping = THREE.NoToneMapping;
$('stage').appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); fail('The graphics context was lost. Reload to try again, or play the 2D game.'); });
renderer.domElement.addEventListener('webglcontextrestored', () => location.reload());

const scene = new THREE.Scene();
{ const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f7fd1'); gr.addColorStop(0.55, '#7db9e8'); gr.addColorStop(1, '#d6e8f2'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.fog = new THREE.FogExp2(0xd6e8f2, 0.0095);
const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 400);

let composer, bloom;
function buildComposer() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.55, 0.4, 0.92);
  const origSetSize = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => origSetSize(w * (tier === 1 ? 0.5 : 1), h * (tier === 1 ? 0.5 : 1));
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}
buildComposer();

function applyTier() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP[tier]));
  resize();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 2 || h < 2) return; // hidden/collapsed viewport: keep the last good size
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 74 : 62;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// ---- helpers ----
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry32(1913);
const CYAN = 0x00fff9, PINK = 0xff6ec7, GOLD = 0xf6e05e, GREEN = 0x10b981;
const edgeMats = { cyan: new THREE.LineBasicMaterial({ color: CYAN }), pink: new THREE.LineBasicMaterial({ color: PINK }) };
const colliders = []; // circles {x, z, r}
try { await Promise.race([document.fonts.load('bold 92px VT323'), new Promise((r) => setTimeout(r, 1500))]); } catch (e) { /* font optional */ }

// glow sprite texture
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();

// ---- world ----
const STREET_END = -138, STREET_START = 12, HALF_WIDTH = 7.2;
const TERRA = 0xc9744c, ADOBE = 0xd9a766, CREAM = 0xe9d8b4, SAGE = 0x8d9b6e, BRICK = 0xb85c3e, SAND = 0xd6b88a, DUSTY = 0x7f9bb0;
const STUCCO = [TERRA, ADOBE, CREAM, SAGE, BRICK, SAND, CREAM, ADOBE, DUSTY];
const INK = new THREE.LineBasicMaterial({ color: 0x3b2a1e });
const lam = (c) => new THREE.MeshLambertMaterial({ color: c });
const flat = (c) => new THREE.MeshBasicMaterial({ color: c });

// daylight: warm sun + sky/ground bounce (no shadows, cheap)
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0xa88a60, 2.4));
const sun = new THREE.DirectionalLight(0xfff0d2, 2.4); sun.position.set(-30, 50, 25); scene.add(sun);

// ground, road, sidewalks
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 340), flat(0x9a8566));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -100); scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(10.8, 340), flat(0x5d5852));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.03, -100); scene.add(road);
for (const x of [-6.7, 6.7]) {
  const walk = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 340), flat(0xcdbd9f));
  walk.rotation.x = -Math.PI / 2; walk.position.set(x, 0.06, -100); scene.add(walk);
  const curb = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 340), flat(0xe3d8c0)); curb.position.set(x > 0 ? 5.4 : -5.4, 0.08, -100); scene.add(curb);
}
// painted road line (dashed yellow, like the real thing)
const dashGeo = new THREE.PlaneGeometry(0.22, 2.4); dashGeo.rotateX(-Math.PI / 2);
const dashes = new THREE.InstancedMesh(dashGeo, flat(0xe3b52e), 32);
const dm = new THREE.Matrix4();
for (let i = 0; i < 32; i++) { dm.setPosition(0, 0.05, STREET_START - i * 5); dashes.setMatrixAt(i, dm); }
scene.add(dashes);

// sun disc + soft clouds
{
  const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xfff2c4, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  sunSpr.scale.set(70, 70, 1); sunSpr.position.set(-70, 85, -250); scene.add(sunSpr);
  const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
  for (let i = 0; i < 9; i++) {
    const g = new THREE.Group(), n = 3 + Math.floor(rnd() * 3);
    for (let j = 0; j < n; j++) { const b = new THREE.Mesh(new THREE.SphereGeometry(5 + rnd() * 4, 8, 6), cloudMat); b.position.set(j * 7 - n * 3, rnd() * 2, rnd() * 3); b.scale.y = 0.55; g.add(b); }
    g.position.set(-130 + i * 32 + rnd() * 10, 55 + rnd() * 30, -260 - rnd() * 40); scene.add(g);
  }
}

// painted signs (atlas): colored boards with cream lettering
const SIGN_WORDS = ['TACOS', 'CERVEZA', 'ABIERTO', 'PANCHOS', 'VINYL', 'LIVE', 'BAR', 'CAFE'];
const SIGN_BG = ['#b85c3e', '#2f5d8a', '#3f6b45', '#8a3b2e', '#d9a766', '#2f5d8a', '#3f6b45', '#8a3b2e'];
function makeAtlas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 512);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 92px VT323, monospace';
  SIGN_WORDS.forEach((w, i) => {
    const cx = (i % 4) * 256 + 128, cy = Math.floor(i / 4) * 256 + 128;
    g.fillStyle = SIGN_BG[i]; g.fillRect(cx - 120, cy - 60, 240, 120);
    g.strokeStyle = '#f4ead2'; g.lineWidth = 5; g.strokeRect(cx - 112, cy - 52, 224, 104);
    g.fillStyle = i === 4 ? '#2a1f16' : '#f4ead2'; g.fillText(w, cx, cy + 4);
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const atlas = makeAtlas();
const signMat = new THREE.MeshBasicMaterial({ map: atlas, side: THREE.DoubleSide });
function addSign(word, x, y, z, side) {
  const geo = new THREE.PlaneGeometry(4.6, 2.3), col = word % 4, row = Math.floor(word / 4);
  const u0 = col * 0.25, u1 = u0 + 0.25, v1 = 1 - (row * 256 + 64) / 512, v0 = 1 - (row * 256 + 192) / 512;
  const uv = geo.attributes.uv; uv.setXY(0, u0, v1); uv.setXY(1, u1, v1); uv.setXY(2, u0, v0); uv.setXY(3, u1, v0);
  const m = new THREE.Mesh(geo, signMat); m.position.set(x, y, z); m.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; scene.add(m);
}

// stucco buildings both sides (inner face at |x| = 8): terracotta, adobe, cream, sage
const windowGeo = new THREE.PlaneGeometry(1.0, 1.35);
const windows = new THREE.InstancedMesh(windowGeo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), 3000);
windows.instanceMatrix.setUsage(THREE.StaticDrawUsage);
let wCount = 0; const wm = new THREE.Matrix4(), wq = new THREE.Quaternion(), wc = new THREE.Color();
const WIN_COLS = [0x35546b, 0x35546b, 0x4a6a82, 0x4a6a82, 0x2c4358, 0xf0d9a0];
const AWNINGS = [0xb85c3e, 0x2f5d8a, 0x3f6b45, 0xd9a766];
for (const side of [-1, 1]) {
  let z = STREET_START;
  while (z > STREET_END - 10) {
    const w = 8 + rnd() * 4, depth = 10, h = 6 + rnd() * 6 + Math.min(8, Math.abs(z) * 0.05);
    const bld = new THREE.Mesh(new THREE.BoxGeometry(depth, h, w), lam(STUCCO[Math.floor(rnd() * STUCCO.length)]));
    bld.position.set(side * (8 + depth / 2), h / 2, z - w / 2); scene.add(bld);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bld.geometry), INK); edges.position.copy(bld.position); scene.add(edges);
    const parapet = new THREE.Mesh(new THREE.BoxGeometry(depth + 0.3, 0.7, w + 0.3), lam(0x8a6f4d)); parapet.position.set(bld.position.x, h + 0.2, bld.position.z); scene.add(parapet);
    // storefront awning
    if (rnd() > 0.35) {
      const aw = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.18, Math.min(w - 1.5, 6)), lam(AWNINGS[Math.floor(rnd() * AWNINGS.length)]));
      aw.position.set(side * 7.1, 3.0, z - w / 2); aw.rotation.z = side * 0.18; scene.add(aw);
    }
    // glass windows on the street-facing side
    wq.setFromEuler(new THREE.Euler(0, side > 0 ? -Math.PI / 2 : Math.PI / 2, 0));
    const cols = Math.floor((w - 1.2) / 2.2), rows = Math.floor((h - 2) / 3);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (rnd() > 0.7 || wCount >= 3000) continue;
      wm.compose(new THREE.Vector3(side * 7.97, 4.4 + r * 3, z - 1.4 - c * 2.2 - (w - cols * 2.2) / 2 + 0.3), wq, new THREE.Vector3(1, 1, 1));
      windows.setMatrixAt(wCount, wm); windows.setColorAt(wCount, wc.setHex(WIN_COLS[Math.floor(rnd() * WIN_COLS.length)])); wCount++;
    }
    if (rnd() > 0.5 && z < STREET_START - 14) addSign(Math.floor(rnd() * 8), side * 7.9, 3.8 + rnd() * 1.4, z - w / 2, side);
    z -= w + 1.2;
  }
}
windows.count = wCount; windows.instanceMatrix.needsUpdate = true; if (windows.instanceColor) windows.instanceColor.needsUpdate = true; scene.add(windows);

// street lamps + palms
const palmTrunkMat = lam(0x8a6a45);
const frondMats = [lam(0x4f7d3a), lam(0x5f9244)];
const frondGeo = new THREE.BoxGeometry(0.34, 0.06, 3.2); frondGeo.translate(0, 0, 1.6);
const trunkGeo = new THREE.CylinderGeometry(0.2, 0.34, 6.6, 7); trunkGeo.translate(0, 3.3, 0);
const lampPostGeo = new THREE.BoxGeometry(0.16, 4.8, 0.16); lampPostGeo.translate(0, 2.4, 0);
const lampMat = lam(0x1f3a2e), lanternMat = flat(0xffe2a0);
for (let i = 0; i < 9; i++) {
  const z = STREET_START - 8 - i * 15;
  for (const side of [-1, 1]) {
    const x = side * 6.3;
    const post = new THREE.Mesh(lampPostGeo, lampMat); post.position.set(x, 0, z); scene.add(post);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.42), lanternMat); head.position.set(x, 5.05, z); scene.add(head);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.14, 0.6), lampMat); cap.position.set(x, 5.4, z); scene.add(cap);
    colliders.push({ x, z, r: 0.3 });
  }
  const px = (i % 2 ? 1 : -1) * 5.0, pz = z - 7.5;
  const trunk = new THREE.Mesh(trunkGeo, palmTrunkMat); trunk.position.set(px, 0, pz); scene.add(trunk);
  for (let f = 0; f < 9; f++) {
    const fr = new THREE.Mesh(frondGeo, frondMats[f % 2]); fr.position.set(px, 6.5, pz); fr.rotation.y = (f / 9) * Math.PI * 2; fr.rotation.x = 0.5; scene.add(fr);
  }
  colliders.push({ x: px, z: pz, r: 0.5 });
}

// GASLAMP QUARTER arch (green board, gold lettering)
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#1f3a2e'; g.fillRect(0, 0, 1024, 256);
  g.strokeStyle = '#e3b52e'; g.lineWidth = 8; g.strokeRect(14, 14, 996, 228);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 124px VT323, monospace'; g.fillStyle = '#f0d58a'; g.fillText('GASLAMP QUARTER', 512, 126);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(14.5, 3.6), new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide }));
  sign.position.set(0, 9.4, -30); scene.add(sign);
  for (const x of [-7.2, 7.2]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.34, 10, 0.34), lam(0x1f3a2e)); p.position.set(x, 5, -30); scene.add(p); }
}

// distant hills, a pale skyline, the bay, and a bridge span (placeholder for Coronado)
{
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(500, 160), flat(0x4f9cc9)); sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0.1, -240); scene.add(sea);
  const hillMat = flat(0xa4b9cb);
  for (let i = 0; i < 7; i++) {
    const h = new THREE.Mesh(new THREE.ConeGeometry(34 + rnd() * 20, 22 + rnd() * 18, 5), hillMat); h.position.set(-150 + i * 50 + rnd() * 10, 8, -300 - rnd() * 20); scene.add(h);
  }
  const skyMat = lam(0xc4cdd6);
