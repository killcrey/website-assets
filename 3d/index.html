<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<title>LAYERS: San Diego (prototype) | The Invisible Panchos</title>
<link rel="icon" href="../theinvisiblepanchos.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #00fff9; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%; }
  .vt { font-family: 'VT323', monospace; }
  #hud-loc { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px; font-size: clamp(1.05rem, 4.6vw, 1.5rem); letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,255,249,.7); pointer-events: none; }
  #hud-obj { position: fixed; top: calc(40px + env(safe-area-inset-top)); left: 16px; font-size: 1.2rem; color: #ff6ec7; text-shadow: 0 0 8px rgba(255,110,199,.7); pointer-events: none; }
  #hud-debug { position: fixed; bottom: 6px; left: 8px; font-size: .9rem; color: #a0aec0; pointer-events: none; white-space: pre; display: none; }
  .btn { background: rgba(0,255,249,.1); border: 1px solid #00fff9; color: #00fff9; padding: 8px 16px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 10px rgba(0,255,249,.2); text-decoration: none; display: inline-block; }
  .btn.pink { border-color: #ff6ec7; color: #ff6ec7; background: rgba(255,110,199,.1); box-shadow: 0 0 14px rgba(255,110,199,.35); }
  #mute { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; padding: 4px 10px; }
  #back { position: fixed; top: calc(52px + env(safe-area-inset-top)); right: 14px; padding: 4px 10px; font-size: .85rem; }
  #enter-btn { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; font-size: 1.3rem; padding: 12px 26px; z-index: 5; }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(0,255,249,.45); border-radius: 50%; display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(0,255,249,.35); box-shadow: 0 0 12px rgba(0,255,249,.6); }
  #hint { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 1.15rem; color: rgba(255,255,255,.55); pointer-events: none; transition: opacity .6s; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(5,5,5,.78); z-index: 10; }
  #fail { display: none; background: #050505; z-index: 20; }
  .title { font-size: clamp(2rem, 9vw, 3.4rem); color: #fff; letter-spacing: .12em; text-shadow: 0 0 14px #00fff9; line-height: 1; }
  .sub { font-size: 1.3rem; color: #ff6ec7; margin: 6px 0 18px; text-shadow: 0 0 8px rgba(255,110,199,.7); }
  .small { font-size: 1rem; color: rgba(255,255,255,.55); margin-top: 14px; max-width: 320px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud-loc" class="vt">SAN DIEGO // GASLAMP QUARTER</div>
<div id="hud-obj" class="vt">FIND THE PORTAL</div>
<div id="hud-debug" class="vt"></div>
<button id="mute" class="btn vt" type="button">SND ON</button>
<a id="back" class="btn" href="../">&#9664; Void Runner</a>
<button id="enter-btn" class="btn pink vt" type="button">ENTER THE PORTAL</button>
<div id="stick"><div id="knob"></div></div>
<div id="hint" class="vt">LEFT THUMB: MOVE &nbsp;|&nbsp; RIGHT SIDE: LOOK</div>

<div id="start" class="overlay">
  <div class="title vt">LAYERS</div>
  <div class="sub vt">SAN DIEGO &mdash; EARLY PROTOTYPE</div>
  <button id="start-btn" class="btn pink vt" type="button" style="font-size:1.4rem;padding:12px 30px;">TAP TO START</button>
  <div class="small vt">WASD / ARROWS + DRAG TO LOOK<br>or use the on-screen thumb controls</div>
  <a class="btn" href="../" style="margin-top:18px;font-size:.85rem;">Back to the 2D game</a>
</div>

<div id="fail" class="overlay">
  <div class="title vt">3D NOT AVAILABLE</div>
  <div id="fail-msg" class="small vt" style="margin:10px 0 18px;"></div>
  <a class="btn pink" href="../">Play the 2D game</a>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
function fail(msg) { $('fail-msg').textContent = msg; $('fail').style.display = 'flex'; }

// ---- load Three.js (break-proof: any failure shows a fallback to the 2D game) ----
let THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
try {
  THREE = await import('three');
  const [m1, m2, m3, m4] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
  ]);
  EffectComposer = m1.EffectComposer; RenderPass = m2.RenderPass; UnrealBloomPass = m3.UnrealBloomPass; OutputPass = m4.OutputPass;
} catch (e) {
  fail('Your browser could not load the 3D engine. The 2D game works everywhere.');
  throw e;
}

// ---- renderer + quality tiers ----
const params = new URLSearchParams(location.search);
const ua = navigator.userAgent;
const isMobile = /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
let tier = isMobile ? (lowEnd ? 0 : 1) : 2; // 0 = no bloom, 1 = half-res bloom, 2 = full bloom
if (params.has('tier')) tier = Math.max(0, Math.min(2, +params.get('tier') || 0));
const DPR_CAP = [1, 1.25, 2];

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  fail('This device or in-app browser blocked 3D graphics. Open the link in Safari or Chrome, or play the 2D game.');
  throw e;
}
renderer.toneMapping = THREE.NoToneMapping;
$('stage').appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); fail('The graphics context was lost. Reload to try again, or play the 2D game.'); });
renderer.domElement.addEventListener('webglcontextrestored', () => location.reload());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07040f);
scene.fog = new THREE.FogExp2(0x07040f, 0.016);
const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 400);

let composer, bloom;
function buildComposer() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.9, 0.5, 0.55);
  const origSetSize = bloom.setSize.bind(bloom);
  bloom.setSize = (w, h) => origSetSize(w * (tier === 1 ? 0.5 : 1), h * (tier === 1 ? 0.5 : 1));
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}
buildComposer();

function applyTier() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP[tier]));
  resize();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 2 || h < 2) return; // hidden/collapsed viewport: keep the last good size
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 74 : 62;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// ---- helpers ----
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry32(1913);
const CYAN = 0x00fff9, PINK = 0xff6ec7, GOLD = 0xf6e05e, GREEN = 0x10b981;
const edgeMats = { cyan: new THREE.LineBasicMaterial({ color: CYAN }), pink: new THREE.LineBasicMaterial({ color: PINK }) };
const colliders = []; // circles {x, z, r}
try { await Promise.race([document.fonts.load('bold 92px VT323'), new Promise((r) => setTimeout(r, 1500))]); } catch (e) { /* font optional */ }

// ---- world ----
const STREET_END = -138, STREET_START = 12, HALF_WIDTH = 7.2;

// ground + synthwave grid
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 340), new THREE.MeshBasicMaterial({ color: 0x07060f }));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -100); scene.add(ground);
const grid = new THREE.GridHelper(340, 170, 0x0e6b70, 0x0e6b70); grid.position.set(0, 0.02, -100); scene.add(grid);

// curb neon + dashed road line
for (const [x, col] of [[-5.4, CYAN], [5.4, PINK]]) {
  const curb = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 160), new THREE.MeshBasicMaterial({ color: col }));
  curb.position.set(x, 0.07, -62); scene.add(curb);
}
const dashGeo = new THREE.PlaneGeometry(0.22, 2.2); dashGeo.rotateX(-Math.PI / 2);
const dashes = new THREE.InstancedMesh(dashGeo, new THREE.MeshBasicMaterial({ color: PINK }), 30);
const dm = new THREE.Matrix4();
for (let i = 0; i < 30; i++) { dm.setPosition(0, 0.04, STREET_START - i * 5); dashes.setMatrixAt(i, dm); }
scene.add(dashes);

// stars
{
  const n = 700, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, b = Math.acos(rnd() * 0.9), r = 320;
    pos[i * 3] = Math.sin(b) * Math.cos(a) * r; pos[i * 3 + 1] = Math.cos(b) * r * 0.8 + 20; pos[i * 3 + 2] = Math.sin(b) * Math.sin(a) * r - 80;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false })));
}

// sign atlas (neon words, additive so the black vanishes)
const SIGN_WORDS = ['TACOS', 'CERVEZA', 'OPEN', 'PANCHOS', 'VINYL', 'LIVE', 'BAR', 'CAFE'];
const SIGN_COLS = ['#00fff9', '#ff6ec7', '#f6e05e', '#ff6ec7', '#00fff9', '#10b981', '#f6e05e', '#00fff9'];
function makeAtlas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 512);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 92px VT323, monospace';
  SIGN_WORDS.forEach((w, i) => {
    const cx = (i % 4) * 256 + 128, cy = Math.floor(i / 4) * 256 + 128, col = SIGN_COLS[i];
    g.shadowColor = col; g.shadowBlur = 22; g.fillStyle = col; g.fillText(w, cx, cy + 4);
    g.strokeStyle = col; g.lineWidth = 4; g.strokeRect(cx - 118, cy - 58, 236, 116); g.shadowBlur = 0;
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const atlas = makeAtlas();
const signMat = new THREE.MeshBasicMaterial({ map: atlas, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
function addSign(word, x, y, z, side) {
  const geo = new THREE.PlaneGeometry(4.6, 2.3), i = word, col = i % 4, row = Math.floor(i / 4);
  const u0 = col * 0.25, u1 = u0 + 0.25, v1 = 1 - (row * 256 + 64) / 512, v0 = 1 - (row * 256 + 192) / 512;
  const uv = geo.attributes.uv; uv.setXY(0, u0, v1); uv.setXY(1, u1, v1); uv.setXY(2, u0, v0); uv.setXY(3, u1, v0);
  const m = new THREE.Mesh(geo, signMat); m.position.set(x, y, z); m.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; scene.add(m);
}

// buildings both sides (inner face at |x| = 8)
const windowGeo = new THREE.PlaneGeometry(1.0, 1.35);
const windows = new THREE.InstancedMesh(windowGeo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), 3000);
windows.instanceMatrix.setUsage(THREE.StaticDrawUsage);
let wCount = 0; const wm = new THREE.Matrix4(), wq = new THREE.Quaternion(), wc = new THREE.Color();
const WIN_COLS = [GOLD, GOLD, CYAN, PINK, 0xfff1c9];
for (const side of [-1, 1]) {
  let z = STREET_START;
  while (z > STREET_END - 10) {
    const w = 8 + rnd() * 4, depth = 10, h = 8 + rnd() * 10 + Math.min(14, Math.abs(z) * 0.1);
    const shade = rnd();
    const bld = new THREE.Mesh(new THREE.BoxGeometry(depth, h, w), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.03 + shade * 0.04, 0.025 + shade * 0.03, 0.09 + shade * 0.07) }));
    bld.position.set(side * (8 + depth / 2), h / 2, z - w / 2); scene.add(bld);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bld.geometry), rnd() > 0.5 ? edgeMats.cyan : edgeMats.pink);
    edges.position.copy(bld.position); scene.add(edges);
    // lit windows on the street-facing side
    wq.setFromEuler(new THREE.Euler(0, side > 0 ? -Math.PI / 2 : Math.PI / 2, 0));
    const cols = Math.floor((w - 1.2) / 2.2), rows = Math.floor((h - 2) / 3);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (rnd() > 0.46 || wCount >= 3000) continue;
      wm.compose(new THREE.Vector3(side * 7.97, 2.6 + r * 3, z - 1.4 - c * 2.2 - (w - cols * 2.2) / 2 + 0.3), wq, new THREE.Vector3(1, 1, 1));
      windows.setMatrixAt(wCount, wm); windows.setColorAt(wCount, wc.setHex(WIN_COLS[Math.floor(rnd() * WIN_COLS.length)])); wCount++;
    }
    if (rnd() > 0.55 && z < STREET_START - 14) addSign(Math.floor(rnd() * 8), side * 7.9, 3.4 + rnd() * 2.6, z - w / 2, side);
    z -= w + 1.2;
  }
}
windows.count = wCount; windows.instanceMatrix.needsUpdate = true; if (windows.instanceColor) windows.instanceColor.needsUpdate = true; scene.add(windows);

// glow sprite texture
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();

// street lamps + palms
const palmTrunkMat = new THREE.MeshBasicMaterial({ color: 0x1a1230 });
const frondMat = new THREE.MeshBasicMaterial({ color: GREEN });
const frondGeo = new THREE.BoxGeometry(0.28, 0.06, 3.0); frondGeo.translate(0, 0, 1.5);
const trunkGeo = new THREE.CylinderGeometry(0.2, 0.32, 6.6, 6); trunkGeo.translate(0, 3.3, 0);
const lampPostGeo = new THREE.BoxGeometry(0.14, 5.2, 0.14); lampPostGeo.translate(0, 2.6, 0);
for (let i = 0; i < 9; i++) {
  const z = STREET_START - 8 - i * 15;
  for (const side of [-1, 1]) {
    const x = side * 6.3;
    const post = new THREE.Mesh(lampPostGeo, new THREE.MeshBasicMaterial({ color: 0x2a2540 })); post.position.set(x, 0, z); scene.add(post);
    const col = side > 0 ? PINK : CYAN;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), new THREE.MeshBasicMaterial({ color: col })); head.position.set(x, 5.3, z); scene.add(head);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); glow.scale.set(5, 5, 1); glow.position.set(x, 5.3, z); scene.add(glow);
    colliders.push({ x, z, r: 0.3 });
  }
  // palm between lamps
  const px = (i % 2 ? 1 : -1) * 5.0, pz = z - 7.5;
  const trunk = new THREE.Mesh(trunkGeo, palmTrunkMat); trunk.position.set(px, 0, pz); scene.add(trunk);
  for (let f = 0; f < 8; f++) {
    const fr = new THREE.Mesh(frondGeo, frondMat); fr.position.set(px, 6.5, pz); fr.rotation.y = (f / 8) * Math.PI * 2; fr.rotation.x = 0.55; scene.add(fr);
  }
  colliders.push({ x: px, z: pz, r: 0.5 });
}

// GASLAMP QUARTER arch
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 256);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 120px VT323, monospace';
  g.shadowColor = '#ff6ec7'; g.shadowBlur = 30; g.fillStyle = '#ff6ec7'; g.fillText('GASLAMP QUARTER', 512, 116);
  g.shadowColor = '#00fff9'; g.shadowBlur = 16; g.strokeStyle = '#00fff9'; g.lineWidth = 5; g.strokeRect(24, 24, 976, 208); g.shadowBlur = 0;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(14.5, 3.6), new THREE.MeshBasicMaterial({ map: t, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  sign.position.set(0, 9.4, -30); scene.add(sign);
  for (const x of [-7.2, 7.2]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.28, 10, 0.28), new THREE.MeshBasicMaterial({ color: CYAN })); p.position.set(x, 5, -30); scene.add(p); }
}

// distant skyline + a bridge span (placeholder for Coronado)
{
  const skyMat = new THREE.MeshBasicMaterial({ color: 0x0c0a1e });
  for (let i = 0; i < 26; i++) {
    const w = 5 + rnd() * 8, h = 18 + rnd() * 50, x = -90 + i * 7.2 + rnd() * 3;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), skyMat); b.position.set(x, h / 2, -178 - rnd() * 14); scene.add(b);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry), rnd() > 0.5 ? edgeMats.cyan : edgeMats.pink); e.position.copy(b.position); scene.add(e);
  }
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(-120, 6, -150), new THREE.Vector3(-40, 70, -165), new THREE.Vector3(60, 6, -150));
  const bridge = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.5, 5, false), new THREE.MeshBasicMaterial({ color: PINK })); scene.add(bridge);
}

// end-of-street bollards
for (let x = -7; x <= 7; x += 2.3) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.1, 0.4), new THREE.MeshBasicMaterial({ color: GOLD })); b.position.set(x, 0.55, STREET_END); scene.add(b); }

// the portal (placeholder: leads into the 2D Void Runner)
const PORTAL = { x: 0, z: -118 };
const portal = new THREE.Group(); portal.position.set(PORTAL.x, 3.6, PORTAL.z); scene.add(portal);
const ring = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.2, 10, 40), new THREE.MeshBasicMaterial({ color: PINK })); portal.add(ring);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.1, 8, 36), new THREE.MeshBasicMaterial({ color: CYAN })); portal.add(ring2);
const disc = new THREE.Mesh(new THREE.CircleGeometry(3.0, 32), new THREE.MeshBasicMaterial({ map: glowTex, color: 0x9b4dff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); portal.add(disc);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 60, 6, 1, true), new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })); beam.position.set(PORTAL.x, 30, PORTAL.z); scene.add(beam);

// ---- player (placeholder pancho: capsule + glowing eye) ----
const player = new THREE.Group(); scene.add(player);
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.9, 4, 10), new THREE.MeshBasicMaterial({ color: 0x1d1b3a })); body.position.y = 0.95; player.add(body);
const outline = new THREE.Mesh(new THREE.CapsuleGeometry(0.47, 0.95, 4, 10), new THREE.MeshBasicMaterial({ color: CYAN, side: THREE.BackSide })); outline.position.y = 0.95; player.add(outline);
const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.27, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); eyeW.position.set(0, 1.25, 0.34); player.add(eyeW);
const eyeP = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), new THREE.MeshBasicMaterial({ color: PINK })); eyeP.position.set(0, 1.25, 0.57); player.add(eyeP);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 })); shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.03; player.add(shadow);
player.position.set(0, 0, 6);

// ---- input ----
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyE' || e.code === 'Enter') tryEnterPortal(); startAudio(); });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
const stick = { x: 0, y: 0, id: null, ox: 0, oy: 0 }, look = { id: null, lx: 0 };
let yaw = 0, started = false;
const stickEl = $('stick'), knobEl = $('knob'), STICK_R = 50;
window.addEventListener('pointerdown', (e) => {
  if (!started || (e.target.closest && e.target.closest('button,a'))) return;
  startAudio();
  if (e.clientX < window.innerWidth / 2 && stick.id === null && e.pointerType !== 'mouse') {
    stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
    stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px'; stickEl.style.display = 'block'; knobEl.style.transform = 'none';
  } else if (look.id === null) { look.id = e.pointerId; look.lx = e.clientX; }
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const d = Math.hypot(dx, dy);
    if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
    stick.x = dx / STICK_R; stick.y = -dy / STICK_R; knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  } else if (e.pointerId === look.id) { yaw -= (e.clientX - look.lx) * 0.006; look.lx = e.clientX; }
});
function endPointer(e) {
  if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; stickEl.style.display = 'none'; }
  if (e.pointerId === look.id) look.id = null;
}
window.addEventListener('pointerup', endPointer); window.addEventListener('pointercancel', endPointer);
window.addEventListener('contextmenu', (e) => e.preventDefault());

// ---- audio (synth, same spirit as the 2D game) ----
let ac = null, master = null, muted = false, nextStep = 0, stepIdx = 0;
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  if (!ac) {
    try { ac = new AC(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.32; master.connect(ac.destination);
    nextStep = ac.currentTime + 0.1; setInterval(scheduleMusic, 60);
  }
  if (ac.state !== 'running') ac.resume && ac.resume();
}
function tone(type, freq, t, dur, vol, lp) {
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function scheduleMusic() {
  if (!ac || ac.state !== 'running') { if (ac) nextStep = Math.max(nextStep, ac.currentTime); return; }
  const SPB = 60 / 96 / 4; // 16th note
  while (nextStep < ac.currentTime + 0.25) {
    const bar = Math.floor(stepIdx / 16) % 4, s = stepIdx % 16, ch = CHORDS[bar], t = nextStep;
    if (s === 0) { for (const n of ch) { tone('sawtooth', mtof(n), t, SPB * 15, 0.05, 900); tone('sawtooth', mtof(n) * 1.006, t, SPB * 15, 0.04, 900); } tone('triangle', mtof(ch[0] - 12), t, SPB * 7, 0.22, 500); }
    if (s === 8) tone('triangle', mtof(ch[0] - 12), t, SPB * 7, 0.2, 500);
    if (s % 2 === 0) tone('square', mtof(ch[(s / 2) % 3] + 12), t, SPB * 1.6, 0.045, 2600);
    if (s % 4 === 0) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.16); }
    nextStep += SPB; stepIdx++;
  }
}
function blip(freq) { if (!ac || ac.state !== 'running' || muted) return; tone('square', freq, ac.currentTime, 0.05, 0.05, 1800); }
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? 'SND OFF' : 'SND ON'; if (master) master.gain.value = muted ? 0 : 0.32; startAudio(); });
document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend && ac.suspend(); else ac.resume && ac.resume(); });

// ---- start / portal ----
$('start-btn').addEventListener('click', () => { started = true; $('start').style.display = 'none'; startAudio(); setTimeout(() => { $('hint').style.opacity = 0; }, 6000); });
function tryEnterPortal() { if (started && Math.hypot(player.position.x - PORTAL.x, player.position.z - PORTAL.z) < 5) location.href = '../'; }
$('enter-btn').addEventListener('click', tryEnterPortal);

// ---- game loop ----
const vel = new THREE.Vector3(); let faceAngle = Math.PI, stepTimer = 0, tAccum = 0;
const camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3();
const SPEED = 7.2;
function update(dt) {
  tAccum += dt;
  let ix = stick.x, iy = stick.y;
  if (started) {
    if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy += 1; if (keys.KeyS || keys.ArrowDown) iy -= 1;
    if (keys.KeyQ) yaw += dt * 1.8; if (keys.KeyZ) yaw -= dt * 1.8;
  } else { ix = iy = 0; }
  const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; }
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const tx = (fx * iy + rx * ix) * SPEED, tz = (fz * iy + rz * ix) * SPEED, k = 1 - Math.exp(-12 * dt);
  vel.x += (tx - vel.x) * k; vel.z += (tz - vel.z) * k;
  const p = player.position; p.x += vel.x * dt; p.z += vel.z * dt;
  p.x = Math.max(-HALF_WIDTH, Math.min(HALF_WIDTH, p.x)); p.z = Math.max(STREET_END + 1, Math.min(STREET_START, p.z));
  for (const c of colliders) { const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), min = c.r + 0.45; if (d < min && d > 0.0001) { p.x = c.x + (dx / d) * min; p.z = c.z + (dz / d) * min; } }
  const spd = Math.hypot(vel.x, vel.z);
  if (spd > 0.5) { const target = Math.atan2(vel.x, vel.z); let diff = target - faceAngle; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); faceAngle += diff * (1 - Math.exp(-14 * dt)); }
  player.rotation.y = faceAngle;
  body.position.y = outline.position.y = 0.95 + Math.abs(Math.sin(tAccum * 12)) * 0.07 * Math.min(1, spd / SPEED);
  body.rotation.x = outline.rotation.x = Math.min(0.25, spd / SPEED * 0.25);
  if (spd > 2) { stepTimer -= dt; if (stepTimer <= 0) { blip(spd > 5 ? 220 : 196); stepTimer = 0.32; } }

  const D = camera.aspect < 1 ? 11 : 9, H = camera.aspect < 1 ? 6 : 5;
  camTarget.set(p.x + Math.sin(yaw) * D, H, p.z + Math.cos(yaw) * D);
  camera.position.lerp(camTarget, 1 - Math.exp(-7 * dt));
  lookTarget.set(p.x, 1.6, p.z); camera.lookAt(lookTarget);

  ring.rotation.z += dt * 0.6; ring2.rotation.z -= dt * 1.1; disc.material.opacity = 0.7 + Math.sin(tAccum * 3) * 0.2; portal.scale.setScalar(1 + Math.sin(tAccum * 2.2) * 0.03);
  const dist = Math.hypot(p.x - PORTAL.x, p.z - PORTAL.z);
  $('hud-obj').textContent = dist < 5 ? 'PORTAL OPEN' : 'FIND THE PORTAL  ▸  ' + Math.round(dist) + 'm';
  $('enter-btn').style.display = (started && dist < 5) ? 'block' : 'none';
}
function render() { if (tier === 0) renderer.render(scene, camera); else composer.render(); }

// adaptive quality: only ever steps down, and only after a stable sample
let emaDt = 1 / 60, frames = 0, lastDrop = 0;
function adapt(dt, now) {
  emaDt += (dt - emaDt) * 0.05; frames++;
  if (frames > 120 && tier > 0 && emaDt > 0.028 && now - lastDrop > 3000) { tier--; lastDrop = now; frames = 60; applyTier(); }
}
const debugEl = $('hud-debug'); if (params.has('debug')) debugEl.style.display = 'block';
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt); render(); adapt(dt, now);
  if (debugEl.style.display === 'block') debugEl.textContent = `tier ${tier}  ${Math.round(1 / emaDt)}fps  calls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}`;
  requestAnimationFrame(frame);
}
camera.position.set(0, 5, 17); applyTier();
window.__g = { update, render, player, camera, scene, renderer, setTier(t) { tier = t; applyTier(); }, get tier() { return tier; }, set yaw(v) { yaw = v; }, start() { started = true; } };
requestAnimationFrame(frame);
</script>
