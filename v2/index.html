// ---------- helpers ----------
const mats = {};

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- ground / street ----------
const ZMIN = -112, ZMAX = 12;

// ---------- buildings (facade painted on a canvas) ----------
const STYLES = {
  brick:  { wall: '#b4543a', trim: '#f0d9b5', win: '#2b4c63', glass: '#79b7d9', awn: ['#f0d9b5', '#2f6f4f'] },

  teal:   { wall: '#3f9aa3', trim: '#f4efe2', win: '#274a5c', glass: '#9fd6e6', awn: ['#ffb627', '#274a5c'] },
  pink:   { wall: '#e48fa8', trim: '#fff0e6', win: '#4a3a5c', glass: '#a9d4f0', awn: ['#3d348b', '#fff0e6'] },
  mural:  { wall: '#f2b134', trim: '#2c2a4a', win: '#2c2a4a', glass: '#7fc8e8', awn: ['#e4572e', '#2c2a4a'] },

function facade(style, cols, floors, shop) {

const risers = []; // buildings that grow up when a district unlocks

// ---------- districts ----------
const DIST = [
  { name: 'GASLAMP QUARTER', z0: 8, z1: -52, styles: ['brick', 'stucco', 'brick', 'teal', 'brick', 'sand'] },
  { name: 'BARRIO LOGAN', z0: -52, z1: -112, styles: ['mural', 'pink', 'teal', 'mural', 'stucco', 'pink'] },
];
const groups = [];
DIST.forEach((D, di) => {
  const grp = new THREE.Group(); scene.add(grp); groups.push(grp); D.risers = [];
  let zc = D.z0 - 4, i = 0;
  for (const side of [-1, 1]) {
    zc = D.z0 - 4; i = side < 0 ? 0 : 3;
    while (zc > D.z1 + 8) {

  }
  const carCols = [0xe4572e, 0x3d7ea6, 0xf3c53a, 0xe9e4d8, 0x2f6f4f, 0x8e4a9e];
  for (let z = D.z0 - 8; z > D.z1 + 6; z -= 15 + rnd() * 8) car(rnd() < 0.5 ? -2.2 : 2.2, z, carCols[Math.floor(rnd() * carCols.length)], rnd() < 0.5 ? 0 : Math.PI, grp);
  D.group = grp;
});
function palm(x, z, grp) {
  const g = new THREE.Group(), lean = (rnd() - 0.5) * 0.25, trunkH = 4.6 + rnd() * 1.4;
  const t = mesh(new THREE.CylinderGeometry(0.13, 0.2, trunkH, 8), M(0x8a6a48), 0, trunkH / 2, 0); t.rotation.z = lean; g.add(t);
  const top = new THREE.Group(); top.position.set(-Math.sin(lean) * trunkH, trunkH, 0); g.add(top);
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2, leaf = mesh(new THREE.ConeGeometry(0.42, 2.6, 5), M(0x3f9b4a), Math.cos(a) * 1.0, -0.2, Math.sin(a) * 1.0); leaf.rotation.set(Math.sin(a) * 1.25, 0, -Math.cos(a) * 1.25); leaf.scale.z = 0.35; top.add(leaf); }

function lamp(x, z, grp) { box(0.14, 4.2, 0.14, 0x2e3340, x, 2.1, z, grp); box(0.6, 0.12, 0.12, 0x2e3340, x - Math.sign(x) * 0.25, 4.15, z, grp); const l = mesh(new THREE.SphereGeometry(0.2, 10, 8), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0xffe9a0, emissiveIntensity: 0.9 }), x - Math.sign(x) * 0.5, 4.0, z, false, false); grp.add(l); solid(x - 0.2, x + 0.2, z - 0.2, z + 0.2); }
function car(x, z, col, rot, grp) {

  g.add(mesh(new THREE.BoxGeometry(1.9, 0.7, 4.0), M(col, 0.5), 0, 0.65, 0));
  g.add(mesh(new THREE.BoxGeometry(1.7, 0.6, 2.0), M(0xcfe7f2, 0.3), 0, 1.3, -0.1));
  for (const sx of [-1, 1]) for (const sz of [-1.3, 1.3]) { const w = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.3, 12), M(0x1b1b1f), sx * 0.95, 0.36, sz); w.rotation.z = Math.PI / 2; g.add(w); }
  grp.add(g); const c = Math.cos(rot) < 0 ? 1 : 1; solid(x - 1.0, x + 1.0, z - 2.1, z + 2.1);
}
// the Bodega, a landmark on the first block (left side)
{
  const grp = groups[0], x = -14.5, z = -20;
  box(1.2, 0.5, 6, 0xe4572e, -6.4, 3.1, z, grp).rotation.z = 0.12;
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#1c2a48'; g.fillRect(0, 0, 512, 128); g.fillStyle = '#ffd34d'; g.font = '900 78px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('BODEGA', 256, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 1.3), new THREE.MeshBasicMaterial({ map: t })); sign.rotation.y = Math.PI / 2; sign.position.set(-6.65, 4.1, z); grp.add(sign);
}

// ---------- barricade that holds the next district back ----------
const barricade = new THREE.Group(); scene.add(barricade);
for (let i = -3; i <= 3; i++) { const p = box(1.3, 1.0, 0.25, i % 2 ? 0xf3c53a : 0xe9e4d8, i * 1.4, 0.7, DIST[0].z1 + 0.5, barricade); }
const barCol = solid(-9, 9, DIST[0].z1 - 0.3, DIST[0].z1 + 0.9, 'bar');
// the second district stays buried until unlocked
DIST[1].risers.forEach((r) => { r.b.scale.y = 0.001; r.cap.visible = false; r.solid.on = false; });
DIST[1].group.children.forEach((o) => { if (!DIST[1].risers.some((r) => r.b === o || r.cap === o)) o.visible = false; });

// ---------- hero (jointed, procedurally animated) ----------
function makeHero() {

  const cream = M(0xf3ddb0, 0.8), cream2 = M(0xe2c690, 0.8), orange = M(0xd9602f, 0.7), green = M(0x6d7a4c, 0.9), blue = M(0x4f7f99, 0.7), skin = M(0xb97a50, 0.7), hair = M(0x15171d, 0.6), steel = M(0x9aa6ad, 0.35);
  const cap = (r, len, mat) => mesh(new THREE.CapsuleGeometry(r, len, 6, 12), mat);

  for (const [k, sx] of [['L', 1], ['R', -1]]) {
    const hip = new THREE.Group(); hip.position.set(sx * 0.14, 0.84, 0); body.add(hip);
    const th = cap(0.105, 0.24, cream); th.position.y = -0.2; hip.add(th);
    const knee = new THREE.Group(); knee.position.y = -0.4; hip.add(knee);
    const sh = cap(0.09, 0.16, cream2); sh.position.y = -0.17; knee.add(sh);
    const pad = mesh(new THREE.BoxGeometry(0.17, 0.14, 0.07), blue, 0, -0.02, 0.09); knee.add(pad);
    const boot = mesh(new THREE.BoxGeometry(0.19, 0.22, 0.34), green, 0, -0.36, 0.05); knee.add(boot);
    const band = mesh(new THREE.CylinderGeometry(0.098, 0.098, 0.05, 12), orange, 0, -0.27, 0); knee.add(band);
    J['hip' + k] = hip; J['knee' + k] = knee;

  const hips = cap(0.2, 0.04, cream2); hips.position.y = 0.86; hips.scale.z = 0.85; body.add(hips);
  // torso
  const torso = new THREE.Group(); torso.position.y = 0.95; body.add(torso); J.torso = torso;
  const chest = cap(0.22, 0.26, cream); chest.position.y = 0.26; chest.scale.z = 0.82; torso.add(chest);
  torso.add(mesh(new THREE.BoxGeometry(0.34, 0.2, 0.08), cream2, 0, 0.34, 0.2));
  for (const sx of [-1, 1]) { torso.add(mesh(new THREE.SphereGeometry(0.035, 8, 6), steel, sx * 0.08, 0.34, 0.25)); torso.add(mesh(new THREE.BoxGeometry(0.05, 0.42, 0.02), green, sx * 0.15, 0.27, 0.19)); }

  for (const sx of [-1, 1]) torso.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.36, 10), steel, sx * 0.24, 0.3, -0.27));

  const head = new THREE.Group(); head.position.set(0, 1.64, 0); body.add(head); J.head = head;
  const neck = mesh(new THREE.TorusGeometry(0.17, 0.045, 8, 18), steel, 0, 1.44, 0); neck.rotation.x = Math.PI / 2; body.add(neck);
  const skull = mesh(new THREE.SphereGeometry(0.2, 18, 14), skin); skull.scale.set(0.95, 1.05, 1); head.add(skull);
  const hr = mesh(new THREE.SphereGeometry(0.215, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair, 0, 0.03, -0.015); head.add(hr);
  const fringe = mesh(new THREE.BoxGeometry(0.3, 0.09, 0.12), hair, 0.02, 0.15, 0.15); fringe.rotation.x = -0.3; head.add(fringe);
  for (const sx of [-1, 1]) { head.add(mesh(new THREE.SphereGeometry(0.03, 8, 6), M(0x10131a, 0.3), sx * 0.075, 0.015, 0.185)); head.add(mesh(new THREE.SphereGeometry(0.06, 8, 6), skin, sx * 0.2, 0, 0)); }

  for (const [k, sx] of [['L', 1], ['R', -1]]) {
    const sh = new THREE.Group(); sh.position.set(sx * 0.31, 1.4, 0); body.add(sh);
    sh.add(mesh(new THREE.SphereGeometry(0.125, 12, 10), orange));
    const up = cap(0.078, 0.14, cream); up.position.y = -0.19; sh.add(up);
    const el = new THREE.Group(); el.position.y = -0.36; sh.add(el);
    const fo = cap(0.07, 0.12, cream); fo.position.y = -0.15; el.add(fo);
    el.add(mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.05, 10), blue, 0, -0.27, 0));
    el.add(mesh(new THREE.SphereGeometry(0.09, 10, 8), M(0xb8a47c, 0.8), 0, -0.36, 0));

const hero = makeHero(); scene.add(hero.root);

// ---------- effects pool (dust puffs + pickup sparkles) ----------
const FX = []; const fxGeo = new THREE.SphereGeometry(0.5, 8, 6);
for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })); m.visible = false; scene.add(m); FX.push({ m, t: 0, life: 0, v: new THREE.Vector3(), s0: 0.2, s1: 0.5 }); }

function stepFx(dt) { for (const f of FX) { if (f.life <= 0) continue; f.t += dt; const k = f.t / f.life; if (k >= 1) { f.life = 0; f.m.visible = false; continue; } f.m.position.addScaledVector(f.v, dt); const s = f.s0 + (f.s1 - f.s0) * k; f.m.scale.setScalar(s); f.m.material.opacity = 0.55 * (1 - k); } }

// ---------- collectibles ----------
const items = [];
const gemGeo = new THREE.OctahedronGeometry(0.42, 0), gemMat = new THREE.MeshStandardMaterial({ color: 0x4fe6ff, emissive: 0x16b7d6, emissiveIntensity: 0.9, roughness: 0.25 });
function blocked(x, z, r) { return colliders.some((c) => c.x0 - r < x && x < c.x1 + r && c.z0 - r < z && z < c.z1 + r); }
DIST.forEach((D, di) => {
  let n = 0, tries = 0; D.items = [];
  while (n < 12 && tries++ < 800) {
    const x = (rnd() - 0.5) * 11, z = D.z0 - 6 - rnd() * (D.z0 - D.z1 - 12);

function currentDistrict() { return P.pos.z < DIST[1].z0 + 1 && unlocked[1] ? 1 : 0; }

const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3(0, 15, 14);
camera.position.copy(camPos); camera.lookAt(0, 0, 0);

    if (Math.hypot(it.x - P.pos.x, it.z - P.pos.z) < 1.15 && !it.got) { it.got = true; it.g.visible = false; got++; $('n').textContent = got; for (let q = 0; q < 8; q++) { const a = q / 8 * Math.PI * 2; puff(it.x, 0.9, it.z, 0x7ff0ff, Math.cos(a) * 2.6, 1.4, Math.sin(a) * 2.6, 0.55, 0.16, 0.05); }
      if (got >= NEED && !unlocked[it.d + 1] && DIST[it.d + 1]) unlock(it.d + 1); else if (got < NEED) toast(`${got} / ${NEED}`, 0.7); } }

  const want = new THREE.Vector3(camTarget.x * 0.85, 15.5 * CAMK, camTarget.z + 13.5 * CAMK), kc = 1 - Math.exp(-5.5 * dt);

  sun.position.set(P.pos.x + 14, 28, P.pos.z + 10); sun.target.position.set(P.pos.x, 0, P.pos.z); sun.target.updateMatrixWorld();
