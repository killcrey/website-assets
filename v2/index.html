<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';

const $ = (id) => document.getElementById(id);

// RENDERER / SCENE

let renderer;

// =====================================================================================

const XC = [B + S / 2, STEP + B + S / 2], ZC = B + S / 2; // street centre lines (x of the two vertical streets, z of the horizontal one)

const vcMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92 });
const unit = { box: new THREE.BoxGeometry(1, 1, 1), cyl: new THREE.CylinderGeometry(1, 1, 1, 10), cone: new THREE.ConeGeometry(1, 1, 6), sph: new THREE.SphereGeometry(1, 10, 8) };

}
const colliders = [];
function solid(x0, x1, z0, z1, vis = true) { const c = { x0, x1, z0, z1, on: true, vis }; colliders.push(c); return c; }

// ---------- ground, streets, crossings ----------
const outer = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0xcdbf98, roughness: 1 })); outer.rotation.x = -Math.PI / 2; outer.position.set(W / 2, -0.03, D / 2); outer.receiveShadow = true; scene.add(outer);
const roads = new Batch(), ASPH = 0x3b4150, EXT = 18;
roads.box(W + EXT * 2, 0.06, S, ASPH, W / 2, 0.01, ZC);
for (const xc of XC) roads.box(S, 0.06, D + EXT * 2, ASPH, xc, 0.011, D / 2);
for (const xc of XC) for (let z = -EXT + 2; z < D + EXT; z += 4) if (Math.abs(z - ZC) > S / 2 + 1) roads.box(0.22, 0.01, 2, 0xf3c53a, xc, 0.05, z);
for (let x = -EXT + 2; x < W + EXT; x += 4) if (!XC.some((xc) => Math.abs(x - xc) < S / 2 + 1)) roads.box(2, 0.01, 0.22, 0xf3c53a, x, 0.05, ZC);
for (const xc of XC) { // zebra crossings on all four arms + stop lines
  for (let k = -3; k <= 3; k++) { for (const sz of [-1, 1]) roads.box(0.8, 0.012, 3, 0xefefef, xc + k * 1.15, 0.052, ZC + sz * (S / 2 + 1.7)); }
  for (let k = -3; k <= 3; k++) { for (const sx of [-1, 1]) roads.box(3, 0.012, 0.8, 0xefefef, xc + sx * (S / 2 + 1.7), 0.052, ZC + k * 1.15); }
}
roads.build();

// ---------- traffic lights (two shared materials, flipped by the phase clock) ----------
const lampH = new THREE.MeshBasicMaterial({ color: 0x40e070 }), lampV = new THREE.MeshBasicMaterial({ color: 0xff4a3a });
const LAMP_CYCLE = 16, GREEN_X = [0, 6.5], GREEN_Z = [8, 14.5]; // seconds: x-traffic green, all red, z-traffic green, all red
const lights = new Batch(), lampGeo = new THREE.BoxGeometry(0.26, 0.2, 0.26);
for (const xc of XC) for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const px = xc + sx * (S / 2 + 0.7), pz = ZC + sz * (S / 2 + 0.7);
  lights.cyl(0.07, 3.4, 0x2e3340, px, 1.7, pz); lights.box(0.34, 0.6, 0.34, 0x20242d, px, 3.5, pz);
  const a = new THREE.Mesh(lampGeo, lampH), b = new THREE.Mesh(lampGeo, lampV); a.position.set(px, 3.62, pz); b.position.set(px, 3.38, pz); scene.add(a, b);

lights.build();
const lightT = (t) => t % LAMP_CYCLE, greenX = (t) => lightT(t) >= GREEN_X[0] && lightT(t) < GREEN_X[1], greenZ = (t) => lightT(t) >= GREEN_Z[0] && lightT(t) < GREEN_Z[1];

// ---------- facades: painted on small canvases, cached and shared between buildings ----------
const STYLES = {
  brick:  { wall: '#b4543a', trim: '#f0d9b5', win: '#2b4c63', glass: '#79b7d9', awn: ['#f0d9b5', '#2f6f4f'] },
  stucco: { wall: '#f0c98b', trim: '#fff4dc', win: '#3a5d7a', glass: '#8cc6e8', awn: ['#e4572e', '#fff4dc'] },
  teal:   { wall: '#3f9aa3', trim: '#f4efe2', win: '#274a5c', glass: '#9fd6e6', awn: ['#ffb627', '#274a5c'] },
  pink:   { wall: '#e48fa8', trim: '#fff0e6', win: '#4a3a5c', glass: '#a9d4f0', awn: ['#3d348b', '#fff0e6'] },
  mural:  { wall: '#f2b134', trim: '#2c2a4a', win: '#2c2a4a', glass: '#7fc8e8', awn: ['#e4572e', '#2c2a4a'] },
  sand:   { wall: '#d9b98a', trim: '#fff6e4', win: '#5b4636', glass: '#9acbe0', awn: ['#4a7c59', '#fff6e4'] },

const texCache = {};
function facade(style, cols, floors, shop) {

  const g = c.getContext('2d'); g.fillStyle = S_.wall; g.fillRect(0, 0, c.width, c.height);

      g.fillStyle = S_.win; g.fillRect(x + 6, y + 18, cw - 12, ch - 18); g.fillStyle = S_.glass; g.fillRect(x + 9, y + 22, cw - 18, ch - 28);
      for (let s = 0; s < 6; s++) { g.fillStyle = S_.awn[s % 2]; g.fillRect(x + 4 + s * ((cw - 8) / 6), y + 6, (cw - 8) / 6 + 1, 14); }
    } else {
      g.fillStyle = S_.trim; g.fillRect(x + 10, y + 12, cw - 20, ch - 22); g.fillStyle = S_.win; g.fillRect(x + 13, y + 15, cw - 26, ch - 28);

  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats); m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  bt.box(1, 0.7, 1, 0x7a7a7a, x + w * 0.2, h + 0.35, z - d * 0.15); // rooftop unit

// ---------- props (all go into the block batch) ----------
function palm(bt, x, z) {
  const th = rr(4.4, 5.8), lean = rr(-0.2, 0.2); bt.add('cyl', 0x8a6a48, x, th / 2 + 0.2, z, 0.17, th, 0.17, 0, 0, lean);

}
function lamp(bt, x, z) { bt.box(0.14, 4.2, 0.14, 0x2e3340, x, 2.1, z); bt.box(0.7, 0.12, 0.12, 0x2e3340, x + 0.3, 4.15, z); bt.sph(0.22, 0xfff1b0, x + 0.6, 4.0, z); solidBox(x, z, 0.4, 0.4, false); }
function tree(bt, x, z) { const th = rr(2.2, 3); bt.cyl(0.2, th, 0x7a5a3a, x, th / 2, z); bt.sph(1.5, 0x4aa04e, x, th + 1.0, z, 1, 0.9, 1); bt.sph(1.0, 0x5fb35c, x + 0.7, th + 1.7, z - 0.3); solidBox(x, z, 0.6, 0.6, false); }

// =====================================================================================
// BLOCK THEMES (data-driven: each block is a ring of buildings + a courtyard)
// =====================================================================================
const THEMES = [

  [{ name: 'HOME BASE', st: ['stucco', 'sand'], fl: [2, 3], lot: 0xd9d2c3, gx: 15, gz: 15, south: false, east: false, west: false }, { name: 'PAYPHONE PARK', st: ['sand'], fl: [1, 1], lot: 0x8fc46f, none: true }, { name: 'GASLAMP ROW', st: ['brick', 'sand', 'brick'], fl: [4, 6], lot: 0xcfc5b0, gx: 17, gz: 12 }],

const blockOf = (x, z) => { const i = Math.floor(x / STEP), j = Math.floor(z / STEP); if (i < 0 || j < 0 || i >= COLS || j >= ROWS) return null; return (x - i * STEP < B && z - j * STEP < B) ? [i, j] : null; };

for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
  const T = THEMES[j][i], x0 = bx0(i), z0 = bz0(j), bt = new Batch(), pick = () => T.st[Math.floor(rnd() * T.st.length)], fl = () => T.fl[0] + Math.floor(rnd() * (T.fl[1] - T.fl[0] + 1));

  const L = (lx, lz) => [x0 + lx, z0 + lz];

    const north = (a, b, style) => { const w = b - a, [px, pz] = L(a + w / 2, 6.5); bld(bt, px, pz, w, 7, fl(), style, 'n'); }, south = (a, b, style) => { const w = b - a, [px, pz] = L(a + w / 2, 23.5); bld(bt, px, pz, w, 7, fl(), style, 's'); };

  for (const [lx, lz] of [[1.2, 1.2], [B - 1.2, 1.2], [1.2, B - 1.2], [B - 1.2, B - 1.2]]) lamp(bt, x0 + lx, z0 + lz);
  if (T.name === 'BODEGA ROW') { dumpster(bt, x0 + 22, z0 + 11.5); planter(bt, x0 + 5, z0 + 11); benchP(bt, x0 + 15, z0 + 17, 0); }
  if (T.name === 'PORCH STREET') { for (const lx of [10, 20]) { fence(bt, x0 + lx, z0 + 15, 0.3, 6); fence(bt, x0 + lx, z0 + 11.4, 3.6, 0.3); planter(bt, x0 + lx + 1.4, z0 + 18.5); } }
  if (T.name === 'MURAL ALLEY') { dumpster(bt, x0 + 12, z0 + 14, 0x3d7ea6); dumpster(bt, x0 + 19, z0 + 16, 0x8e4a9e); planter(bt, x0 + 15, z0 + 12); }
  if (T.name === 'HOME BASE') { benchP(bt, x0 + 8, z0 + 8, 0); benchP(bt, x0 + 22, z0 + 8, 0); bt.box(3.4, 1.0, 1.4, 0x1c2a48, PAD.x + 7, 0.7, PAD.z - 4.5); bt.cyl(0.5, 0.2, 0x7ff0ff, PAD.x + 5.9, 1.3, PAD.z - 4.9); bt.cyl(0.5, 0.2, 0x7ff0ff, PAD.x + 8.1, 1.3, PAD.z - 4.9); solidBox(PAD.x + 7, PAD.z - 4.5, 3.4, 1.4, false); } // boombox
  if (T.name === 'PAYPHONE PARK') {
